spring:
  application:
    name: gateway-api
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: user-service
              uri: lb://USERSERVICE
              predicates:
                - Path=/user-service/**
  security:
    jwt:
      secret-key: "5Kj8mN2pQ7rT9vW1xY4zA6bC3dE0fG8hI5jK2lM7nO9pR1sT4uV6wX8yZ0aB3cD5"
      expiration: 100000000

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
